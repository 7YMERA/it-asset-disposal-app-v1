                  OnSelect: |
                    =Patch(
                        'ITAssetDisposal-Case',
                        LookUp('ITAssetDisposal-Case', ID = varSelectedCase.ID),
                        {
                            Status: "Pending 1st Level Approval"
                        }
                    );

                    // Step 0: Refresh SharePoint data to ensure latest items
                    Refresh('ITAssetDisposal-Item');

                    // Step 1: Clear colNewItems (unsaved local items)
                    Clear(colNewItems);

                    // Step 2: Rebuild colSharePointItems with fresh data
                    ClearCollect(
                        colSharePointItems,
                        Filter(
                            'ITAssetDisposal-Item',
                            caseNo = Text(varSelectedCase.ID)
                        )
                    );

                    // Step 3: Rebuild combined gallery data
                    ClearCollect(
                        colCombinedAssets,
                        colSharePointItems
                    );


                    // Step 4: Close popup
                    Set(varPopupAsset, false);
                    Set(varConfirmSubmissionToApprovers, false);
                    Set(varItemList, false);

                    // Step 5: Notify user
                    Notify("All items submitted!", NotificationType.Success)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
