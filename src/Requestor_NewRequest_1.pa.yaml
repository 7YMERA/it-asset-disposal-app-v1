            - Add Item:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  DisplayMode: |+
                    =If(
                        varAssetType = "Asset",
                        If(
                            IsBlank(DropdownItemAsset.Selected.Value) ||
                            IsBlank(DropdownManufacturerAsset.Selected.Value) ||
                            IsBlank(DropdownModelAsset.Selected.Value) ||
                            IsBlank(txtAssetTag.Text) ||
                            IsBlank(txtSerial.Text),
                            DisplayMode.Disabled,
                            DisplayMode.Edit
                        ),
                        If(
                            IsBlank(DropdownItemNonAsset.Selected.Value) ||
                            IsBlank(DropdownManufacturerNonAsset.Selected.Value) ||
                            IsBlank(DropdownModelNonAsset.Selected.Value) ||
                            IsBlank(txtQuantity_2.Text),
                            DisplayMode.Disabled,
                            DisplayMode.Edit
                        )
                    )
                  Fill: =RGBA(0, 20, 220, 1)
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: |+
                    =ColorFade(Self.Fill, -0.2)
                  OnSelect: "=If(\r\n    varAssetType = \"Asset\",\r\n    \r\n    // ASSET logic\r\n    Collect(\r\n        colAssetItems,\r\n        {\r\n            uid: Text(Now(), \"yyyymmddhhmmssfff\"), // Unique timestamp-based ID\r\n            caseNo: varCaseID,\r\n            assetType: \"Asset\",\r\n            item: DropdownItemAsset.Selected.Value,\r\n            model: DropdownModelAsset.Selected.Value,\r\n            manufacturer: DropdownManufacturerAsset.Selected.Value,\r\n            serial: txtSerial.Text,\r\n            tag: txtAssetTag.Text,\r\n            quantity: \"-\"\r\n        }\r\n    );\r\n    \r\n    // Reset asset controls\r\n    //Reset('DropdownItem-Asset');\r\n   // Reset('DropdownModel-Asset');\r\n    //Reset('DropdownManufacturer-Asset');\r\n    Reset(txtSerial);\r\n    Reset(txtAssetTag);\r\n\r\n,\r\n\r\n    // NON ASSET logic\r\n    Collect(\r\n        colAssetItems,\r\n        {\r\n            uid: Text(Now(), \"yyyymmddhhmmssfff\"), // Same unique ID approach\r\n            caseNo: varCaseID,\r\n            assetType: \"Non Asset\",\r\n            item: DropdownItemNonAsset.Selected.Value,\r\n            model: DropdownModelNonAsset.Selected.Value,\r\n            manufacturer: DropdownManufacturerNonAsset.Selected.Value,\r\n            quantity: txtQuantity_2.Text,\r\n            serial: \"-\",\r\n            tag: \"-\"\r\n        }\r\n    );\r\n    \r\n    // Reset non-asset controls\r\n    //Reset('DropdownItem-NonAsset');\r\n   // Reset('DropdownModel-NonAsset');\r\n    //Reset('DropdownManufacturer-NonAsset');\r\n   Reset(txtQuantity_2)\r\n)\r\n"
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: ="Add Item"
                  X: =98
                  Y: =808
