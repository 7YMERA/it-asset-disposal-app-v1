      - ContainerConfirmSubmissionToApprovers:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Group: GroupAreYouSureSubmitThisCase
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =399
            RadiusBottomLeft: =50
            RadiusBottomRight: =50
            RadiusTopLeft: =50
            RadiusTopRight: =50
            Visible: =varConfirmSubmissionToApprovers
            Width: =1096
            X: =Parent.Width/2 - Self.Width/2
            Y: =Parent.Height/2 - Self.Height/2
          Children:
            - Label18:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(255, 0, 0, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Size: =20
                  Text: |-
                    ="Are you sure you want to submit this case to your approvers?

                    Once you have submitted this case, you wont be able to edit this case until its rejected."
                  Width: =602
                  X: =246
                  Y: =72
            - Add Item_4:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(255, 0, 0, 1)
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: |+
                    =Patch(
                        'ITAssetDisposal-Case',
                        LookUp('ITAssetDisposal-Case', ID = varSelectedCase.ID),
                        {
                            Status: "Pending 1st Level Approval"
                        }
                    );

                    // Step 0: Refresh SharePoint data to ensure latest items
                    Refresh('ITAssetDisposal-Item');

                    // Step 1: Clear colNewItems (unsaved local items)
                    Clear(colNewItems);

                    // Step 2: Rebuild colSharePointItems with fresh data
                    ClearCollect(
                        colSharePointItems,
                        Filter(
                            'ITAssetDisposal-Item',
                            caseNo = Text(varSelectedCase.ID)
                        )
                    );

                    // Step 3: Rebuild combined gallery data
                    ClearCollect(
                        colCombinedAssets,
                        colSharePointItems
                    );


                    // Step 4: Close popup
                    Set(varPopupAsset, false);
                    Set(varConfirmSubmissionToApprovers, false);
                    Set(varItemList, false);

                    // Step 5: Notify user
                    Notify("All items submitted!", NotificationType.Success)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: ="Submit"
                  Visible: =varSelectedCase.Status = "Draft"
                  X: =317
                  Y: =298
            - Add Item_6:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(106, 122, 127, 1)
                  Font: =Font.'Open Sans'
