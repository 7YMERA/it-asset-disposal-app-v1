            - ButtonSaveDraft:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  DisplayMode: |+
                    =If(
                        (CountRows(colNewItems) > 0 && Checkbox1.Value) || varHasEditedOnce,
                        DisplayMode.Edit,
                        DisplayMode.Disabled
                    )
                  Fill: =RGBA(0, 20, 220, 1)
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: |-
                    =ColorFade(
                        RGBA(
                            0,
                            20,
                            220,
                            100
                        ),
                        -20%
                    )
                  OnSelect: |
                    =// Step 1: Save each new item to SharePoint
                    ForAll(
                        colNewItems,
                        Patch(
                            'ITAssetDisposal-Item',
                            Defaults('ITAssetDisposal-Item'),
                            {
                                caseNo: varSelectedCase.ID,
                                assetType: ThisRecord.assetType,
                                Items: ThisRecord.Items,
                                assetModel: ThisRecord.assetModel,
                                assetBrand: ThisRecord.assetBrand,
                                SerialNum: ThisRecord.SerialNum,
                                AssetTag: ThisRecord.AssetTag,
                                Quantity: If(
                                    IsBlank(ThisRecord.Quantity),
                                    "-",
                                    ThisRecord.Quantity
                                ),
                                UID: ThisRecord.UID
                            }
                        )
                    );

                    // Step 2: Clear temporary collection for new items
                    Clear(colNewItems);
                    Set(varSelectedItem, Blank());

                    // Step 3: Delete marked items from SharePoint
                    ForAll(
                        colDeletedItems,
                        RemoveIf(
                            'ITAssetDisposal-Item',
                            UID = ThisRecord.UID
                        )
                    );
                    Clear(colDeletedItems); // Clear temp deletion list

                    // Step 4: Refresh SharePoint items for the current case
                    ClearCollect(
                        colSharePointItems,
                        Filter(
                            'ITAssetDisposal-Item',
                            caseNo = Text(varSelectedCase.ID)
                        )
                    );

                    // Step 5: Rebuild combined gallery data (only from SharePoint now)
                    ClearCollect(
                        colCombinedAssets,
                        colSharePointItems
                    );

                    // Step 6: Exit edit mode and return to view mode
                    Set(varEditDraft, false);
                    Set(varItemList, true);

                    // Step 7: Show success notification
                    Notify(
                        "New items saved and deleted items removed successfully!",
                        NotificationType.Success
                    );
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: ="Save"
                  X: =908
                  Y: =897
