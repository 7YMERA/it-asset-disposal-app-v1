            - Button4:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  DisplayMode: |+
                    =If(
                        !IsBlank(varSelectedItem) &&
                        (
                            // Asset-type fields
                            (
                                varAssetType = "Asset" &&
                                (
                                    DropdownItemAsset_1.Selected.Value <> varSelectedItem.Items ||
                                    DropdownManufacturerAsset_1.Selected.Value <> varSelectedItem.assetBrand ||
                                    DropdownModelAsset_1.Selected.Value <> varSelectedItem.assetModel ||
                                    txtSerial_1.Text <> varSelectedItem.SerialNum ||
                                    txtAssetTag_1.Text <> varSelectedItem.AssetTag
                                )
                            ) ||

                            // Non-Asset-type fields
                            (
                                varAssetType = "Non Asset" &&
                                (
                                    DropdownItemNonAsset_1.Selected.Value <> varSelectedItem.Items ||
                                    DropdownManufacturerNonAsset_1.Selected.Value <> varSelectedItem.assetBrand ||
                                    DropdownModelNonAsset_1.Selected.Value <> varSelectedItem.assetModel ||
                                    txtQuantity_3.Text <> varSelectedItem.Quantity
                                )
                            )
                        ),
                        DisplayMode.Edit,
                        DisplayMode.Disabled
                    )
                  Fill: =RGBA(0, 20, 220, 1)
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: |-
                    =ColorFade(
                        RGBA(
                            0,
                            20,
                            220,
                            100
                        ),
                        -20%
                    )
                  OnSelect: |+
                    =// Step 1: Remove the original item from both collections
                    RemoveIf(colCombinedAssets, UID = varItemToEditUID);
                    RemoveIf(colNewItems, UID = varItemToEditUID);

                    // Step 2: Create the updated record in a variable
                    Set(
                        varUpdatedItem,
                        If(
                            varAssetType = "Asset",
                            {
                                UID: varItemToEditUID,
                                assetType: "Asset",
                                Items: DropdownItemAsset_1.Selected.Value,
                                assetBrand: DropdownManufacturerAsset_1.Selected.Value,
                                assetModel: DropdownModelAsset_1.Selected.Value,
                                SerialNum: txtSerial_1.Text,
                                AssetTag: txtAssetTag_1.Text,
                                Quantity: "-",
                                isEdited: true
                            },
                            {
                                UID: varItemToEditUID,
                                assetType: "Non Asset",
                                Items: DropdownItemNonAsset_1.Selected.Value,
                                assetBrand: DropdownManufacturerNonAsset_1.Selected.Value,
                                assetModel: DropdownModelNonAsset_1.Selected.Value,
                                SerialNum: "-",
                                AssetTag: "-",
                                Quantity: txtQuantity_3.Text,
                                isEdited: true
                            }
                        )
                    );

                    // Step 3: Add updated record back to collections
                    Collect(colCombinedAssets, varUpdatedItem);
                    Collect(colNewItems, varUpdatedItem);

                    // Step 4: Cleanup
                    Set(varSelectedItem, Blank());

                    //Step 5: Enable Editing Flag
                    Set(varHasEditedOnce, true);
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: ="Publish Edits"
                  Visible: |+
                    =varEditMode
                  X: =892
                  Y: =387
