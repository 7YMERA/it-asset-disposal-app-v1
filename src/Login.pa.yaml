                  - Icon9_1:
                      Control: Icon@0.0.7
                      Properties:
                        Height: =142
                        Icon: ="CheckmarkCircle"
                        IconColor: =RGBA(255, 255, 255, 1)
                        Width: =138
                        X: =118
                        Y: =34
                  - Button2_5:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Open Sans'
                        Height: =260
                        HoverBorderColor: =
                        HoverColor: =
                        HoverFill: =Color.Transparent
                        OnSelect: |
                          =Set(varUserRole, "Approver");
                          Set(varLoggedInEmail, User().Email);

                          // Check if user is 1st or 2nd approver by scanning the whole SharePoint list
                          ClearCollect(
                              colUserApproverRoles,
                              Filter(
                                  'ITAssetDisposal-Case',
                                  '1stApproverEmail' = varLoggedInEmail || '2ndApproverEmail' = varLoggedInEmail
                              )
                          );

                          // Store approver level based on first matching case
                          Set(
                              varIsFirstApprover,
                              !IsEmpty(Filter(colUserApproverRoles, '1stApproverEmail' = varLoggedInEmail))
                          );
                          Set(
                              varIsSecondApprover,
                              !IsEmpty(Filter(colUserApproverRoles, '2ndApproverEmail' = varLoggedInEmail))
                          );

                          // Store the second approver name for confirmation popup if you're the first approver
                          If(
                              varIsFirstApprover,
                              Set(
                                  varSecondApproverName,
                                  LookUp(
                                      colUserApproverRoles,
                                      '1stApproverEmail' = varLoggedInEmail,
                                      '2ndApproverName'
                                  )
                              )
                          );

                          // Final conditional navigation
                          If(
                              varIsFirstApprover,
                              Navigate(Approver_ViewRequest1_1stLevel, ScreenTransition.Fade),
                              If(
                                  varIsSecondApprover,
                                  Navigate(Approver_ViewRequest1_2ndLevel, ScreenTransition.Fade)
                              )
                          )
                        PressedBorderColor: =
                        PressedColor: =Self.Fill
                        PressedFill: =
                        Text: =
                        Width: =374
