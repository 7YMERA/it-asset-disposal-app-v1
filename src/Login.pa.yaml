                  - Button2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Open Sans'
                        Height: =260
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =Color.Transparent
                        OnSelect: |+
                          =Set(varUserRole, "Requestor");
                          Navigate(Requestor_ViewRequest, ScreenTransition.Fade);

                          Set(varUserEmail, User().Email);
                          Set(varUserName, User().FullName);

                          ClearCollect(
                              colWatchlist,
                              Filter(
                                  'ITAssetDisposal-Watchlists',
                                  WatchlistEmail = User().Email
                              )
                          );

                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =
                        RadiusBottomLeft: =30
                        RadiusBottomRight: =30
                        RadiusTopLeft: =30
                        RadiusTopRight: =30
                        Text: =
                        VerticalAlign: =VerticalAlign.Bottom
                        Width: =374
            - Label24:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  Height: =49
                  OnSelect: |-
                    =Set(
                        varUserRole,
                        "Approver"
                    );
                    Set(
                        varLoggedInEmail,
                        User().Email
                    );
                    // Check if user is 1st or 2nd approver by scanning the whole SharePoint list
                    ClearCollect(
                        colUserApproverRoles,
                        Filter(
                            'ITAssetDisposal-Case',
                            '1stApproverEmail' = varLoggedInEmail || '2ndApproverEmail' = varLoggedInEmail
                        )
                    );
                    // Store approver level based on first matching case
                    Set(
                        varIsFirstApprover,
                        !IsEmpty(
                            Filter(
                                colUserApproverRoles,
                                '1stApproverEmail' = varLoggedInEmail
                            )
                        )
                    );
                    Set(
                        varIsSecondApprover,
                        !IsEmpty(
                            Filter(
                                colUserApproverRoles,
                                '2ndApproverEmail' = varLoggedInEmail
                            )
                        )
                    );
                    // Store the second approver name for confirmation popup if you're the first approver
                    If(
                        varIsFirstApprover,
                        Set(
                            varSecondApproverName,
                            LookUp(
                                colUserApproverRoles,
                                '1stApproverEmail' = varLoggedInEmail,
                                '2ndApproverName'
                            )
                        )
                    );
                    // Final conditional navigation
                    If(
                        varIsSecondApprover,
                        Navigate(
                            Approver_ViewRequest1_2ndLevel,
                            ScreenTransition.Fade
                        )
                    )
                  Text: |-
                    ="DEBUG
                    Navigate(Approver_ViewRequest1_2ndLevel)"
                  Width: =374
                  X: =627
                  Y: =339
