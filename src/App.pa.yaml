App:
  Properties:
    OnStart: |
      =// 1. Set the logged-in user's details
      Set(varUserEmail, User().Email);
      Set(varUserName, User().FullName);

      // 2. Set default asset type
      Set(varAssetType, "Asset");

      // 3. Check if this user already exists in the Requestor List
      Set(
          varIsDuplicateRequestor,
          !IsBlank(
              LookUp(
                  'Requestor',
                  Email = varUserEmail
              )
          )
      );

      // 4. If not already listed, add user to 'Requestor List (Recorded During Login)'
      If(
          !varIsDuplicateRequestor,
          Patch(
              'Requestor',
              Defaults('Requestor'),
              {
                  Name: varUserName,
                  Email: varUserEmail
              }
          )
      );
    StartScreen: =Login
    Theme: =PowerAppsTheme
